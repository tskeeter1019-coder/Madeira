
name: Build Madeira IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check build files
        run: |
          echo "Checking Madeira build files..."
          ls
          test -f docs/BUILDING.md
          test -f app/Madeira.xcodeproj/project.pbxproj

      - name: Install tools
        run: |
          brew install cmake ninja pkg-config \
            autoconf automake libtool

      - name: Build Madeira
        run: |
          chmod +x scripts/ios-build.sh
          ./scripts/ios-build.sh

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: build-output/Madeira-iOS.ipa
          if-no-files-found: error
          retention-days: 7
