
name: Build Madeira IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install cmake ninja meson pkg-config \
            autoconf automake libtool bison 7zip \
            rust

      - name: Check required files
        run: |
          test -f app/Madeira.xcodeproj/project.pbxproj
          test -f build/fex-ios/build.sh
          test -f build/ffmpeg/build.sh
          test -f build/ntdll-unix/build.sh

      - name: Prepare LLVM MinGW
        run: |
          mkdir -p toolchains
          cd toolchains
          curl -fL -o llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          echo "Extracting LLVM MinGW..."
          tar -xf llvm-mingw.tar.xz

      - name: Build FFmpeg
        run: bash build/ffmpeg/build.sh

      - name: Build GnuTLS for iOS
        run: bash build/gnutls-ios/build.sh
        
      - name: Install FEX Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/fex-python"
          "$RUNNER_TEMP/fex-python/bin/python" -m pip install packaging setuptools
          echo "$RUNNER_TEMP/fex-python/bin" >> "$GITHUB_PATH"

      - name: Build FEX for iOS
        run: bash build/fex-ios/build.sh

      - name: Configure Wine headers
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$(brew --prefix bison)/bin:$PATH"
          echo "Checking Windows cross-compilation tools:"
          command -v aarch64-w64-mingw32-clang || true
          command -v llvm-dlltool || true
          command -v ld.lld || true
          bison --version
          mkdir -p wine/build-macos
          cd wine/build-macos
          if [ ! -f config.status ]; then
            ../configure --without-x --disable-tests --enable-winegstreamer
          fi
          test -f include/config.h

      - name: Build Wine PE headers
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$(brew --prefix bison)/bin:$PATH"
          bash build/wine-pe/build-ntdll.sh
   
      - name: Generate Wine IDL headers
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$(brew --prefix bison)/bin:$PATH"

          make -C wine/build-arm64ec \
            include/dwrite.h \
            include/dwrite_1.h \
            include/dwrite_2.h \
            include/dwrite_3.h \
            include/dcommon.h \
            include/dxgiformat.h \
            include/dxgicommon.h \
            include/dxgitype.h \
            include/dxgi.h \
            include/d3d10.h \
            include/d3d10_1.h \
            include/d2d1.h

          make -C wine/build-macos \
            include/wtypesbase.h \
            include/wtypes.h \
            include/unknwn.h \
            include/objidlbase.h \
            include/objidl.h \
            include/oaidl.h \
            include/propidl.h \
            include/oleidl.h \
            include/ocidl.h \
            include/servprov.h \
            include/mfobjects.h \
            include/mftransform.h

          test -f wine/build-arm64ec/include/dwrite_2.h
          test -f wine/build-arm64ec/include/dxgiformat.h
          test -f wine/build-arm64ec/include/dxgitype.h
          test -f wine/build-arm64ec/include/dxgi.h
          test -f wine/build-arm64ec/include/d3d10.h
          test -f wine/build-arm64ec/include/d3d10_1.h
          test -f wine/build-macos/include/wtypesbase.h
          test -f wine/build-macos/include/unknwn.h
          test -f wine/build-macos/include/oaidl.h
          test -f wine/build-macos/include/propidl.h
          test -f wine/build-macos/include/oleidl.h
          test -f wine/build-macos/include/ocidl.h
          test -f wine/build-arm64ec/include/dxgicommon.h
          test -f wine/build-macos/include/servprov.h
        
      - name: Build FreeType for iOS
        run: |
          mkdir -p research
          git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype
          bash build/freetype-ios/build.sh
 
      - name: Check generated Wine headers
        run: |
          for f in \
            wine/build-arm64ec/include/dwrite.h \
            wine/build-arm64ec/include/dwrite_2.h \
            wine/build-arm64ec/include/dwrite_3.h \
            wine/build-arm64ec/include/dcommon.h \
            wine/build-arm64ec/include/dxgiformat.h \
            wine/build-macos/include/wtypesbase.h \
            wine/build-macos/include/wtypes.h \
            wine/build-macos/include/objidlbase.h \
            wine/build-macos/include/unknwn.h \
            wine/build-macos/include/mfobjects.h \
            wine/build-arm64ec/include/d2d1.h \
            wine/build-macos/include/objidl.h \
            wine/build-arm64ec/include/d3d10.h \
            wine/build-arm64ec/include/d3d10_1.h \
            wine/build-macos/include/oaidl.h \
            wine/build-macos/include/propidl.h \
            wine/build-arm64ec/include/dxgi.h \
            wine/build-macos/include/oleidl.h \
            wine/build-arm64ec/include/dxgitype.h \
            wine/build-macos/include/ocidl.h \
            wine/build-arm64ec/include/dxgicommon.h \
            wine/build-macos/include/servprov.h \
            wine/build-macos/include/mftransform.h; do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
              exit 1
            fi
          done

      - name: Build Wine libraries
        run: |
          if ! bash build/ntdll-unix/build.sh; then
            echo "===== audio_null_ios.err ====="
            cat build/ntdll-unix/obj/audio_null_ios.err || true
            echo "===== madsync.err ====="
            cat build/ntdll-unix/obj/madsync.err || true
            echo "===== debug.err ====="
            cat build/ntdll-unix/obj/debug.err || true
            
            echo "===== bcrypt_unixlib.err ====="
            cat build/ntdll-unix/obj/bcrypt_unixlib.err || true
            echo "===== secur32_unixlib.err ====="
            cat build/ntdll-unix/obj/secur32_unixlib.err || true
            echo "===== dwrite_unixlib.err ====="
            cat build/ntdll-unix/obj/dwrite_unixlib.err || true
            echo "===== crypt32_unixlib.err ====="
            cat build/ntdll-unix/obj/crypt32_unixlib.err || true
            echo "===== winegstreamer_unixlib.err ====="
            cat build/ntdll-unix/obj/winegstreamer_unixlib.err || true
            echo "===== server.err ====="
            cat build/ntdll-unix/obj/server.err || true
            echo "===== config.h check ====="
            ls -l wine/build-macos/include/config.h || true
            exit 1
          fi
          bash build/win32u-unix/build.sh
          bash build/wineserver/build.sh
          
      - name: Build DXMT
        run: bash build/dxmt-ios/build.sh

      - name: Stage licenses
        run: bash build/stage-licenses.sh

      - name: Build iOS app
        run: |
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-output \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build-output/Build/Products/Debug-iphoneos/Madeira.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc \
            --keepParent Payload Madeira.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: Madeira-IPA
          path: Madeira.ipa
          if-no-files-found: error
          retention-days: 7
